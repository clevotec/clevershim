name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Release tag must start with v, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${REPOSITORY}/releases/download/${tag}/clevershim-x86_64-pc-windows-msvc.exe" >> "$GITHUB_OUTPUT"

      - name: Require public package URL and WINGET_TOKEN
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::warning::Repository is private. WinGet cannot download private release assets. Make clevotec/clevershim public, then re-run this workflow."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "::warning::WINGET_TOKEN is missing. The GitHub Release is already published. Komac was not run."
            echo "Add a classic PAT with the public_repo scope as the WINGET_TOKEN secret, and a microsoft/winget-pkgs fork on the same account."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          code=$(curl -sS -o /tmp/installer.bin -w "%{http_code}" -L "$RELEASE_URL")
          if [ "$code" != "200" ]; then
            echo "::error::Installer URL returned HTTP $code: $RELEASE_URL"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Install Komac
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/komac.tar.gz -L "https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/komac.tar.gz -C /tmp
          sudo mv /tmp/komac /usr/local/bin/komac
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Sync clevotec1/winget-pkgs with upstream via GitHub API
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          login=$(gh api user --jq .login)
          if [ "$login" != "clevotec1" ]; then
            echo "::error::WINGET_TOKEN must belong to clevotec1 (got: $login)"
            exit 1
          fi
          # Fast fork sync. Avoids komac sync, which can hang while rewriting a huge winget-pkgs fork.
          if ! gh api -X POST "repos/clevotec1/winget-pkgs/merge-upstream" -f branch=master; then
            echo "::warning::merge-upstream failed; attempting a force sync through the fork default branch tip"
            upstream=$(gh api repos/microsoft/winget-pkgs/git/ref/heads/master --jq .object.sha)
            gh api -X PATCH "repos/clevotec1/winget-pkgs/git/refs/heads/master" -f sha="$upstream" -F force=true >/dev/null
          fi
          gh api repos/clevotec1/winget-pkgs --jq '{full_name,default_branch,pushed_at,parent:.parent.full_name}'

      - name: Submit Clevotec.CleverShim with Komac
        if: env.skip != 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if komac list Clevotec.CleverShim --token "$WINGET_TOKEN" >/tmp/komac-list.txt 2>/tmp/komac-list.err; then
            komac update Clevotec.CleverShim \
              --version "$RELEASE_VERSION" \
              --urls "$RELEASE_URL" \
              --submit \
              --skip-pr-check \
              --token "$WINGET_TOKEN"
          else
            expect <<'EOF'
          set timeout 300
          spawn komac new Clevotec.CleverShim --version $env(RELEASE_VERSION) --urls $env(RELEASE_URL) --submit --skip-pr-check --token $env(WINGET_TOKEN) --publisher Clevotec --publisher-url "https://github.com/$env(REPOSITORY)" --package-name CleverShim --package-url "https://github.com/$env(REPOSITORY)" --package-locale en-US --license MIT --license-url "https://github.com/$env(REPOSITORY)/blob/main/LICENSE" --short-description "Stable PATH shims for winget portable packages" --description "CleverShim puts a stable shim on PATH for winget portable and zip packages, and rewrites that shim when an upgrade moves the real exe." --moniker clevershim --author Clevotec --copyright "Copyright Clevotec" --release-notes-url "https://github.com/$env(REPOSITORY)/releases/tag/$env(RELEASE_TAG)"
          expect {
            -re {(?i)portable exe} { send "n\r"; exp_continue }
            -re {(?i)Silent switch} { send "/install\r"; exp_continue }
            -re {(?i)Silent with progress} { send "/install\r"; exp_continue }
            -re {(?i)Install modes} { send "\r"; exp_continue }
            -re {(?i)Installer return codes} { send "\r"; exp_continue }
            -re {(?i)Upgrade behavior} { send "\r"; exp_continue }
            -re {(?i)Commands} { send "clevershim\r"; exp_continue }
            -re {(?i)Protocols} { send "\r"; exp_continue }
            -re {(?i)File extensions} { send "\r"; exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
          fi
