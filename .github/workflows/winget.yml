name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit, such as v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Release tag must start with v, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${REPOSITORY}/releases/download/${tag}/clevershim-x86_64-pc-windows-msvc.exe" >> "$GITHUB_OUTPUT"

      - name: Require public package URL and WINGET_TOKEN
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::warning::Repository is private. WinGet cannot download private release assets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "::warning::WINGET_TOKEN is missing. Add a clevotec1 classic PAT with public_repo as WINGET_TOKEN."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /tmp/installer.bin -w "%{http_code}" -L "$RELEASE_URL")
          if [ "$code" != "200" ]; then
            echo "::error::Installer URL returned HTTP $code: $RELEASE_URL"
            exit 1
          fi
          echo "sha256=$(sha256sum /tmp/installer.bin | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Open microsoft/winget-pkgs PR as clevotec1
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          INSTALLER_SHA256: ${{ steps.gate.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          login=$(gh api user --jq .login)
          if [ "$login" != "clevotec1" ]; then
            echo "::error::WINGET_TOKEN must belong to clevotec1 (got: $login)"
            exit 1
          fi

          if ! gh api -X POST repos/clevotec1/winget-pkgs/merge-upstream -f branch=master >/tmp/merge.json; then
            echo "::warning::merge-upstream failed; force-syncing master tip"
            upstream=$(gh api repos/microsoft/winget-pkgs/git/ref/heads/master --jq .object.sha)
            gh api -X PATCH repos/clevotec1/winget-pkgs/git/refs/heads/master -f sha="$upstream" -F force=true >/dev/null
          fi
          cat /tmp/merge.json 2>/dev/null || true

          branch="clevotec-clevershim-${RELEASE_VERSION}"
          base_sha=$(gh api repos/clevotec1/winget-pkgs/git/ref/heads/master --jq .object.sha)
          if gh api "repos/clevotec1/winget-pkgs/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/clevotec1/winget-pkgs/git/refs/heads/${branch}" -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST repos/clevotec1/winget-pkgs/git/refs -f ref="refs/heads/${branch}" -f sha="$base_sha" >/dev/null
          fi

          mkdir -p /tmp/manifests
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          version = os.environ["RELEASE_VERSION"]
          url = os.environ["RELEASE_URL"]
          sha256 = os.environ["INSTALLER_SHA256"]
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          release_date = datetime.now(timezone.utc).date().isoformat()
          root = Path("/tmp/manifests")

          (root / "Clevotec.CleverShim.yaml").write_text(
          f"""# Created with clevershim winget workflow
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.10.0.schema.json

          PackageIdentifier: Clevotec.CleverShim
          PackageVersion: {version}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.10.0
          """.replace("          ", ""),
              encoding="utf-8",
          )

          (root / "Clevotec.CleverShim.installer.yaml").write_text(
          f"""# Created with clevershim winget workflow
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

          PackageIdentifier: Clevotec.CleverShim
          PackageVersion: {version}
          Platform:
            - Windows.Desktop
          MinimumOSVersion: 10.0.17763.0
          InstallerType: exe
          Scope: user
          InstallModes:
            - interactive
            - silent
            - silentWithProgress
          UpgradeBehavior: install
          Commands:
            - clevershim
          ReleaseDate: {release_date}
          Installers:
            - Architecture: x64
              InstallerUrl: {url}
              InstallerSha256: {sha256}
              InstallerSwitches:
                Silent: /install
                SilentWithProgress: /install
          ManifestType: installer
          ManifestVersion: 1.10.0
          """.replace("          ", ""),
              encoding="utf-8",
          )

          (root / "Clevotec.CleverShim.locale.en-US.yaml").write_text(
          f"""# Created with clevershim winget workflow
          # yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.10.0.schema.json

          PackageIdentifier: Clevotec.CleverShim
          PackageVersion: {version}
          PackageLocale: en-US
          Publisher: Clevotec
          PublisherUrl: https://github.com/{repo}
          PublisherSupportUrl: https://github.com/{repo}/issues
          Author: Clevotec
          PackageName: CleverShim
          PackageUrl: https://github.com/{repo}
          License: MIT
          LicenseUrl: https://github.com/{repo}/blob/main/LICENSE
          Copyright: Copyright Clevotec
          ShortDescription: Stable PATH shims for winget portable packages
          Description: CleverShim puts a stable shim on PATH for winget portable and zip packages, and rewrites that shim when an upgrade moves the real exe.
          Moniker: clevershim
          Tags:
            - path
            - shim
            - winget
            - portable
          ReleaseNotesUrl: https://github.com/{repo}/releases/tag/{tag}
          ManifestType: defaultLocale
          ManifestVersion: 1.10.0
          """.replace("          ", ""),
              encoding="utf-8",
          )
          PY

          put_file() {
            local path="$1"
            local file="$2"
            local message="$3"
            local b64
            b64=$(base64 -w0 "$file")
            local sha
            sha=$(gh api "repos/clevotec1/winget-pkgs/contents/${path}?ref=${branch}" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/clevotec1/winget-pkgs/contents/${path}" \
                -f message="$message" \
                -f content="$b64" \
                -f branch="$branch" \
                -f sha="$sha" >/dev/null
            else
              gh api -X PUT "repos/clevotec1/winget-pkgs/contents/${path}" \
                -f message="$message" \
                -f content="$b64" \
                -f branch="$branch" >/dev/null
            fi
          }

          prefix="manifests/c/Clevotec/CleverShim/${RELEASE_VERSION}"
          put_file "${prefix}/Clevotec.CleverShim.yaml" /tmp/manifests/Clevotec.CleverShim.yaml "Add Clevotec.CleverShim version ${RELEASE_VERSION}"
          put_file "${prefix}/Clevotec.CleverShim.installer.yaml" /tmp/manifests/Clevotec.CleverShim.installer.yaml "Add Clevotec.CleverShim installer ${RELEASE_VERSION}"
          put_file "${prefix}/Clevotec.CleverShim.locale.en-US.yaml" /tmp/manifests/Clevotec.CleverShim.locale.en-US.yaml "Add Clevotec.CleverShim locale ${RELEASE_VERSION}"

          existing=$(gh api "search/issues?q=repo:microsoft/winget-pkgs+is:pr+author:clevotec1+Clevotec.CleverShim+${RELEASE_VERSION}" --jq '.items[0].html_url // empty' || true)
          if [ -n "$existing" ]; then
            echo "Existing PR: $existing"
          else
            prior=$(gh api "repos/microsoft/winget-pkgs/contents/manifests/c/Clevotec/CleverShim?ref=master" --jq 'length' 2>/dev/null || echo 0)
            if [ "${prior:-0}" -gt 0 ]; then
              pr_title="Update Clevotec.CleverShim to version ${RELEASE_VERSION}"
              pr_intro="Update CleverShim in the Windows Package Manager community repository."
            else
              pr_title="New package: Clevotec.CleverShim version ${RELEASE_VERSION}"
              pr_intro="First WinGet submission for CleverShim."
            fi
            pr_url=$(gh pr create \
              --repo microsoft/winget-pkgs \
              --head "clevotec1:${branch}" \
              --base master \
              --title "$pr_title" \
              --body "## Description
          ${pr_intro}

          - Package: \`Clevotec.CleverShim\`
          - Version: \`${RELEASE_VERSION}\`
          - Installer: ${RELEASE_URL}
          - Silent switch: \`/install\`
          ")
            echo "Opened PR: $pr_url"
          fi
