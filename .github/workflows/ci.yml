name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-ci-lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz" \
            -o /tmp/cargo-audit.tgz
          tar -xzf /tmp/cargo-audit.tgz -C /tmp
          sudo install -m 755 /tmp/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit /usr/local/bin/cargo-audit
          cargo-audit --version

      - name: Audit Rust dependencies
        run: cargo audit

  catalog-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-ci-linux

      - name: Scan the public WinGet source index
        run: cargo run --locked --release --features scan --bin clevershim-scan -- --out catalog/packages.yaml --overrides catalog/overrides.yaml

      - name: Test catalog, path matching, and sidecar logic
        run: cargo test --locked --workspace --all-features -- --test-threads=1

      - name: Upload the scanned catalog
        uses: actions/upload-artifact@v7
        with:
          name: winget-catalog
          path: |
            catalog/packages.yaml
            catalog/collisions.yaml

  windows:
    needs: catalog-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-ci-windows

      - name: Download the scanned catalog
        uses: actions/download-artifact@v8
        with:
          name: winget-catalog
          path: catalog

      - name: Clippy Windows targets (deny warnings)
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Build the shim stub
        run: cargo build --locked --release --bin clevershim-shim

      - name: Embed the stub and build the manager
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item target\release\clevershim-shim.exe assets\clevershim-shim.exe
          cargo build --locked --release --bin clevershim

      - name: Verify WinGet installer metadata
        shell: pwsh
        run: |
          $description = (Get-Item target\release\clevershim.exe).VersionInfo.FileDescription
          if ($description -notmatch '(?i)installer|setup') {
            throw "WinGet requires EXE installer metadata; FileDescription was '$description'"
          }

      - name: Run release tests including Windows repair coverage
        run: cargo test --locked --release --all-features -- --test-threads=1
