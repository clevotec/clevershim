name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-ci-lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz" \
            -o /tmp/cargo-audit.tgz
          tar -xzf /tmp/cargo-audit.tgz -C /tmp
          sudo install -m 755 /tmp/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit /usr/local/bin/cargo-audit
          cargo-audit --version

      - name: Audit Rust dependencies
        run: cargo audit

  catalog-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-ci-linux

      - name: Scan the public WinGet source index
        run: cargo run --locked --release --features scan --bin clevershim-scan -- --out catalog/packages.yaml --overrides catalog/overrides.yaml

      - name: Test catalog, path matching, and sidecar logic
        run: cargo test --locked --workspace --all-features -- --test-threads=1

      - name: Upload the scanned catalog
        uses: actions/upload-artifact@v7
        with:
          name: winget-catalog
          path: |
            catalog/packages.yaml
            catalog/collisions.yaml

  windows:
    needs: catalog-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-ci-windows

      - name: Download the scanned catalog
        uses: actions/download-artifact@v8
        with:
          name: winget-catalog
          path: catalog

      - name: Clippy Windows targets (deny warnings)
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

      - name: Build the shim stub
        run: cargo build --locked --release --bin clevershim-shim

      - name: Embed the stub and build the manager
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item target\release\clevershim-shim.exe assets\clevershim-shim.exe
          # Host target is x86_64-pc-windows-msvc; .cargo/config.toml +crt-static applies.
          cargo build --locked --release --bin clevershim

      - name: Fail if MSVC CRT is dynamically linked
        shell: pwsh
        run: |
          # Prove .cargo/config.toml (+crt-static) took effect on the MSVC
          # artifacts. A later RUSTFLAGS env would silently override config
          # rustflags and reintroduce VCRUNTIME140 / api-ms-win-crt deps.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $patterns = @(
            '**/Hostx64/x64/dumpbin.exe',
            '**/Hostarm64/arm64/dumpbin.exe',
            '**/dumpbin.exe'
          )
          $dumpbin = $null
          foreach ($pattern in $patterns) {
            $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find $pattern |
              Select-Object -First 1
            if ($dumpbin) { break }
            $dumpbin = & $vswhere -latest -products * -find $pattern | Select-Object -First 1
            if ($dumpbin) { break }
          }
          if (-not $dumpbin) { throw 'dumpbin.exe not found via vswhere' }
          Write-Host "dumpbin=$dumpbin"
          $exes = @(
            (Join-Path 'target\release' 'clevershim.exe'),
            (Join-Path 'target\release' 'clevershim-shim.exe')
          )
          $bad = [regex]'VCRUNTIME|MSVCP|api-ms-win-crt'
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            Write-Host "=== dumpbin /dependents $exe ==="
            $out = & $dumpbin /dependents $exe 2>&1 | Out-String
            Write-Host $out
            $hits = $bad.Matches($out) | ForEach-Object { $_.Value } | Select-Object -Unique
            if ($hits.Count -gt 0) {
              throw ("$exe dynamically depends on forbidden CRT DLLs: " + ($hits -join ', '))
            }
            Write-Host "ok: no dynamic MSVC/UCRT imports in $exe"
          }

      - name: Upload MSVC installer for sandbox proving
        uses: actions/upload-artifact@v7
        with:
          name: clevershim-msvc-installer
          path: |
            target/release/clevershim.exe
            target/release/clevershim-shim.exe

      - name: Verify WinGet installer metadata
        shell: pwsh
        run: |
          $description = (Get-Item target\release\clevershim.exe).VersionInfo.FileDescription
          if ($description -notmatch '(?i)installer|setup') {
            throw "WinGet requires EXE installer metadata; FileDescription was '$description'"
          }

      - name: Run release tests including Windows repair coverage
        run: cargo test --locked --release --all-features -- --test-threads=1
