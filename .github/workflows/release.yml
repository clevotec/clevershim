name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish, such as v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-release-scan

      - name: Scan the public WinGet source index
        run: cargo run --locked --release --features scan --bin clevershim-scan -- --out catalog/packages.yaml --overrides catalog/overrides.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: winget-catalog
          path: |
            catalog/packages.yaml
            catalog/collisions.yaml

  build:
    needs: scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clevershim-release-${{ matrix.target }}
          key: ${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: winget-catalog
          path: catalog

      - name: Build both binaries
        shell: pwsh
        run: |
          # Static CRT comes from .cargo/config.toml (+crt-static) so the
          # portable installer does not depend on VCRUNTIME140.dll.
          cargo build --locked --release --target ${{ matrix.target }} --bin clevershim-shim
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\clevershim-shim.exe" assets\clevershim-shim.exe
          cargo build --locked --release --target ${{ matrix.target }} --bin clevershim

      - name: Fail if MSVC CRT is dynamically linked
        shell: pwsh
        run: |
          # Prove .cargo/config.toml (+crt-static) took effect on the MSVC
          # artifacts. A later RUSTFLAGS env would silently override config
          # rustflags and reintroduce VCRUNTIME140 / api-ms-win-crt deps.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $patterns = @(
            '**/Hostx64/x64/dumpbin.exe',
            '**/Hostarm64/arm64/dumpbin.exe',
            '**/dumpbin.exe'
          )
          $dumpbin = $null
          foreach ($pattern in $patterns) {
            $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find $pattern |
              Select-Object -First 1
            if ($dumpbin) { break }
            $dumpbin = & $vswhere -latest -products * -find $pattern | Select-Object -First 1
            if ($dumpbin) { break }
          }
          if (-not $dumpbin) { throw 'dumpbin.exe not found via vswhere' }
          Write-Host "dumpbin=$dumpbin"
          $dir = "target\${{ matrix.target }}\release"
          $exes = @(
            (Join-Path $dir 'clevershim.exe'),
            (Join-Path $dir 'clevershim-shim.exe')
          )
          $bad = [regex]'VCRUNTIME|MSVCP|api-ms-win-crt'
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            Write-Host "=== dumpbin /dependents $exe ==="
            $lines = & $dumpbin /dependents $exe 2>&1
            $dumpbinExit = $LASTEXITCODE
            $out = $lines | Out-String
            if ($dumpbinExit -ne 0) {
              throw ("dumpbin failed on $exe (exit=$dumpbinExit):`n$out")
            }
            Write-Host $out
            # Positive proof dumpbin actually read the import table. A
            # wrong-arch/broken dumpbin can exit oddly or emit empty output
            # with no forbidden CRT names, which would otherwise pass.
            if ($out -notmatch '(?i)KERNEL32\.dll') {
              throw ("dumpbin output for $exe did not list KERNEL32.dll; refusing to treat as a clean CRT scan:`n$out")
            }
            $hits = $bad.Matches($out) | ForEach-Object { $_.Value } | Select-Object -Unique
            if ($hits.Count -gt 0) {
              throw ("$exe dynamically depends on forbidden CRT DLLs: " + ($hits -join ', '))
            }
            Write-Host "ok: no dynamic MSVC/UCRT imports in $exe"
          }

      - name: Zip and hash
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $dir = "target/${{ matrix.target }}/release"
          $name = "clevershim-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$dir/clevershim.exe" "dist/clevershim-${{ matrix.target }}.exe"
          Compress-Archive -Path "$dir/clevershim.exe","$dir/clevershim-shim.exe" -DestinationPath "dist/$name.zip"
          Get-FileHash "dist/$name.zip","dist/clevershim-${{ matrix.target }}.exe" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content "dist/$name.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/clevershim-${{ matrix.target }}.exe
            dist/clevershim-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: winget-catalog
          path: catalog

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Release tag must start with v, got: $tag"
            exit 1
          fi
          if ! [[ -f dist/clevershim-x86_64-pc-windows-msvc.exe ]]; then
            echo "::error::Missing winget installer artifact dist/clevershim-x86_64-pc-windows-msvc.exe"
            ls -la dist
            exit 1
          fi

          publish_once() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* catalog/packages.yaml catalog/collisions.yaml --clobber
            else
              gh release create "$tag" dist/* catalog/packages.yaml catalog/collisions.yaml \
                --title "$tag" \
                --notes "Windows builds of clevershim and clevershim-shim. The x64 exe is the winget installer. packages.yaml is the scanned catalog, including command collisions."
            fi
          }

          attempt=1
          until publish_once; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::GitHub Release publish failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::Release publish attempt $attempt failed; retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done
