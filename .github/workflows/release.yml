name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Scan the public WinGet source index
        run: cargo run --release --features scan --bin clevershim-scan -- --out catalog/packages.yaml --overrides catalog/overrides.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: winget-catalog
          path: |
            catalog/packages.yaml
            catalog/collisions.yaml

  build:
    needs: scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: winget-catalog
          path: catalog
      - name: Build both binaries
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }} --bin clevershim-shim
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item target\${{ matrix.target }}\release\clevershim-shim.exe assets\clevershim-shim.exe
          cargo build --release --target ${{ matrix.target }} --bin clevershim
      - name: Zip and hash
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          $name = "clevershim-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$dir/clevershim.exe" "dist/clevershim-${{ matrix.target }}.exe"
          Compress-Archive -Path "$dir/clevershim.exe","$dir/clevershim-shim.exe" -DestinationPath "dist/$name.zip"
          Get-FileHash "dist/$name.zip","dist/clevershim-${{ matrix.target }}.exe" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: winget-catalog
          path: catalog
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* catalog/packages.yaml catalog/collisions.yaml \
            --title "$tag" \
            --notes "Windows builds of clevershim and clevershim-shim. The x64 exe is the winget installer. packages.yaml is the scanned catalog, including command collisions."
