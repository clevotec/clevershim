[package]
name = "clevershim"
version = "0.1.0"
edition = "2021"
description = "Stable PATH shims for winget portable packages"
license = "MIT"
publish = false

[features]
scan = ["dep:rusqlite", "dep:zip", "dep:reqwest"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
zip = { version = "8", optional = true, default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[[bin]]
name = "clevershim"
path = "src/main.rs"

[[bin]]
name = "clevershim-shim"
path = "src/bin/shim.rs"

[[bin]]
name = "clevershim-scan"
path = "src/bin/scan.rs"
required-features = ["scan"]
